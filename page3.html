<!DOCTYPE html>
<html>
<head>
    <style>
        .first {
            background-color: blue;
            overflow: hidden;
            height: 500px;
        }
        .second {
            background-color: black;
            overflow: hidden;
            height: 500px;
            position: relative;
            
        }

        .left {
            background-color: blueviolet;
            float: left;
            width: 30%;
            height: 100%; 
        }
        .third {
            background-color: red;
            overflow: hidden;
            height: 500px;
        }
        .Right {
            background-color: blueviolet;
            float: right;
            width: 30%;
            height: 100%; 
        }
    </style>
</head>
<body>
    <div class="Container">
        <div class="first">
            <h1>p1</h1>
        </div>

        <div class="second">
            <h1>p2</h1>
            <div class="left">
                <h2>Left</h2>
            </div>
            
            <div class="Right">
                <h2>Right</h2>
            </div>
        </div>

        <div class="third">
            <h2>third</h2>
        </div>
    </div>
</body>
</html>
