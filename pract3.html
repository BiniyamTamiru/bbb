<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
              
        }

        .top1 {
            background: red;
            width: 100%;
            height: 25vh;
            color: white;
            font-size: 40px;
            padding: 20px;
            text-align: left;
      
        }

        
        .top1 h2 {
            float: left;
            margin: 0;
            line-height: 10vh; 
        }

    
        .top1 ul {
            list-style: none;
            margin: 0;
            padding: 0;
            float: right;
        }

        .top1 li {
            float: left;
        }

            .top1 li a {
            color: black;
            padding: 15px 20px; 
            text-decoration: none;
            background: white;
            border-radius: 5px;
            font-size: 24px; 
}

        .top1 li a:hover {
            background: rgb(22, 22, 22);
            color: white;
        }

       
        .top {
            width: 100%;
            height: 50vh;
        }

        .first, .second, .right {
            float: left;
            height: 100%;
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 50vh; 
        }

        .first {
            background-color: rgb(225, 225, 247);
            width: 25%;
            color: black;
        }

        .second {
            background-color: rgb(112, 213, 44);
            width: 50%;
        }

        .right {
            background-color: blueviolet;
            width: 25%;
        }

        
        .third {
            background-color: brown;
            
            width: 100%;
            height: 25vh;
            color: white;
            font-size: 40px;
            text-align: center;
            line-height: 25vh;
            overflow: hidden;
        }
        </style>
    </head>
    <body>
        
        <div class="top1">
            <h2>25%</h2>
            <ul>
                <li><a href="page1.html">One</a></li>
                <li><a href="page2.html">Two</a></li>
                <li><a href="page3.html">Three</a></li>
            </ul>
        </div>

    <div class="top">
        <div class="first"><h2>25%</h2></div>
        <div class="second"><h2>50%</h2></div>
        <div class="right"><h2>25%</h2></div>
    </div>

    <div class="third">
        <h2>25%</h2>
    </div>

</body>
</html>
