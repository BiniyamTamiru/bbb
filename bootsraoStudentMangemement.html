<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Management Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  
  <nav class="navbar navbar-dark bg-dark p-3">
    <a class="navbar-brand fw-bold" href="#">Student Dashboard</a>
  </nav>

  <div class="container-fluid mt-3">
    <div class="row">

    
      <div class="col-md-3 col-lg-2 bg-white shadow-sm p-3">
        <h5 class="fw-bold">Menu</h5>
        <div class="list-group">
          <a href="#" class="list-group-item list-group-item-action active">Students</a>
          <a href="#" class="list-group-item list-group-item-action">Courses</a>
          <a href="#" class="list-group-item list-group-item-action">Grades</a>
          <a href="#" class="list-group-item list-group-item-action">Settings</a>
        </div>
      </div>

      <div class="col-md-9 col-lg-10">
        <div class="d-flex justify-content-between align-items-center mt-3">
          <h3 class="fw-bold">Student List</h3>

          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addStudentModal">Add Student</button>
        </div>

        <div class="card mt-3 shadow-sm">
          <div class="card-body">
            <table class="table table-bordered table-striped">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Year</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>0187/16</td>
                  <td>Biniyam Tamiru</td>
                  <td>Software Engineering</td>
                  <td>3rd Year</td>
                  <td>
                    <button class="btn btn-warning btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>

                <tr>
                  <td>002</td>
                  <td> Faruk Bati</td>
                  <td>computer Science</td>
                  <td>3rd Year</td>
                  <td>
                    <button class="btn btn-warning btn-sm">Edit</button>
                    <button class="btn btn-danger btn-sm">Delete</button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>


  <div class="modal fade" id="addStudentModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add Student</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <form>
            <div class="mb-3">
              <label class="form-label">Student Name</label>
              <input type="text" class="form-control" />
            </div>

            <div class="mb-3">
              <label class="form-label">Department</label>
              <select class="form-select">
                <option>Computer Science</option>
                <option>Information Systems</option>
                <option>Software Engineering</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label">Year</label>
              <select class="form-select">
                <option>1st Year</option>
                <option>2nd Year</option>
                <option>3rd Year</option>
                <option>4th Year</option>
              </select>
            </div>
          </form>
        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
